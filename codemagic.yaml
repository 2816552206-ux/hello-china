workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Setup Flutter and iOS dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          xcodebuild -workspace ios/Runner.xcworkspace -list
      - name: Build iOS app (ad-hoc signed)
        script: |
          flutter build ios --debug
          echo "=== 查找 Runner.app ==="
          find build -name "Runner.app" -type d
          echo "=== 检查签名 ==="
          APP=$(find build -name "Runner.app" -type d | head -1)
          ls -la "$APP/_CodeSignature" 2>/dev/null && echo "签名目录存在" || echo "无签名目录"
      - name: Package IPA
        script: |
          set -e
          APP=$(find build -name "Runner.app" -type d | head -1)
          echo "打包: $APP"
          rm -rf /tmp/ipa
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r /tmp/Runner.ipa Payload/
          mkdir -p "$FCI_BUILD_DIR/build/ios/ipa"
          cp /tmp/Runner.ipa "$FCI_BUILD_DIR/build/ios/ipa/Runner.ipa"
          echo "=== 完成 ==="
          ls -la "$FCI_BUILD_DIR/build/ios/ipa/"
    artifacts:
      - build/ios/ipa/Runner.ipa

  android-build:
    name: Android Build
    instance_type: linux_vm
    max_build_duration: 20
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

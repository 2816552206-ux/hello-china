workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Setup Flutter and iOS dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          xcodebuild -workspace ios/Runner.xcworkspace -list
      - name: Build iOS app
        script: |
          flutter build ios --debug --no-codesign
      - name: Find and package unsigned IPA
        script: |
          set -e
          # 查找 Runner.app 位置
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "Found Runner.app at: $APP_PATH"
          ls -la "$APP_PATH"
          # 打包 IPA
          IPA_DIR="build/ios/ipa"
          mkdir -p "$IPA_DIR"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "$FCI_BUILD_DIR/build/ios/ipa/Runner.ipa" Payload/
          cd "$FCI_BUILD_DIR"
          echo "=== IPA 已生成 ==="
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/Runner.ipa

  android-build:
    name: Android Build
    instance_type: linux_vm
    max_build_duration: 20
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

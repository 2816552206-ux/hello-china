workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Setup Flutter and iOS dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          xcodebuild -workspace ios/Runner.xcworkspace -list
      - name: Build iOS app
        script: |
          flutter build ios --debug --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../build/ios/ipa/Runner.ipa Payload/
          cd ../../..
          echo "IPA created at build/ios/ipa/Runner.ipa"
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/Runner.ipa

  android-build:
    name: Android Build
    instance_type: linux_vm
    max_build_duration: 20
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

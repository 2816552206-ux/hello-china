workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Setup Flutter and iOS dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          xcodebuild -workspace ios/Runner.xcworkspace -list
      - name: Build unsigned IPA
        script: |
          set -e
          flutter build ipa --debug --no-codesign --export-method development || {
            echo "flutter build ipa failed, manually packaging..."
            flutter build ios --debug --no-codesign
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
            echo "Found Runner.app at: $APP_PATH"
            mkdir -p build/ios/ipa
            cd "$(dirname "$APP_PATH")"
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r "$FCI_BUILD_DIR/build/ios/ipa/Runner.ipa" Payload/
            cd "$FCI_BUILD_DIR"
          }
          echo "=== IPA 检查 ==="
          ls -la build/ios/ipa/ || echo "ipa 目录为空"
          find build -name "*.ipa" -type f
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/Runner.ipa

  android-build:
    name: Android Build
    instance_type: linux_vm
    max_build_duration: 20
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

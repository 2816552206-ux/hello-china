name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          curl -L -o flutter.zip https://storage.googleapis.com/flutter_infra_release/releases/beta/macos/flutter_macos_3.44.0-0.3.pre-beta.zip
          unzip -q flutter.zip
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter --version

      - name: Setup
        run: |
          flutter pub get
          cd ios && pod update && cd ..

      - name: Build iOS
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
